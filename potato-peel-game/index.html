<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🥔 削土豆皮大挑战</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --gold: #D4A017;
            --easy: #4CAF50;
            --normal: #FF9800;
            --hard: #f44336;
            --hell: #9C27B0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Difficulty Select */
        .diff-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 24px;
            gap: 24px;
        }

        .diff-screen.hidden { display: none; }

        .diff-screen .logo {
            font-size: 80px;
            animation: potatoBounce 0.6s ease-in-out infinite alternate;
        }

        @keyframes potatoBounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-20px) scale(1.1); }
        }

        .diff-screen h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .diff-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 360px;
        }

        .diff-card {
            background: var(--card);
            border: 2px solid #2a3245;
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .diff-card:active { transform: scale(0.95); }

        .diff-card.easy { border-color: #2a4a2a; }
        .diff-card.easy:hover { border-color: var(--easy); box-shadow: 0 0 20px rgba(76,175,80,0.2); }
        .diff-card.easy .diff-icon { color: var(--easy); }

        .diff-card.normal { border-color: #4a3a1a; }
        .diff-card.normal:hover { border-color: var(--normal); box-shadow: 0 0 20px rgba(255,152,0,0.2); }
        .diff-card.normal .diff-icon { color: var(--normal); }

        .diff-card.hard { border-color: #4a1a1a; }
        .diff-card.hard:hover { border-color: var(--hard); box-shadow: 0 0 20px rgba(244,67,54,0.2); }
        .diff-card.hard .diff-icon { color: var(--hard); }

        .diff-card.hell { border-color: #3a1a4a; }
        .diff-card.hell:hover { border-color: var(--hell); box-shadow: 0 0 20px rgba(156,39,176,0.2); }
        .diff-card.hell .diff-icon { color: var(--hell); }

        .diff-icon { font-size: 40px; display: block; margin-bottom: 8px; }
        .diff-name { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .diff-desc { font-size: 11px; color: #888; line-height: 1.4; }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 16px 4px;
            width: 100%;
            max-width: 500px;
        }

        .header h1 {
            font-size: clamp(22px, 5vw, 30px);
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .diff-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .diff-badge.easy { background: rgba(76,175,80,0.2); color: var(--easy); }
        .diff-badge.normal { background: rgba(255,152,0,0.2); color: var(--normal); }
        .diff-badge.hard { background: rgba(244,67,54,0.2); color: var(--hard); }
        .diff-badge.hell { background: rgba(156,39,176,0.2); color: var(--hell); }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            padding: 8px 16px;
            width: 100%;
            max-width: 500px;
            flex-wrap: wrap;
        }

        .stat-box {
            flex: 1;
            min-width: 55px;
            background: var(--card);
            border: 1px solid #2a3245;
            border-radius: 10px;
            padding: 8px 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--gold);
        }

        .stat-label {
            font-size: 10px;
            color: #888;
            margin-top: 1px;
        }

        .stat-box.timer-box .stat-value { color: #ff5252; }
        .stat-box.timer-box.warning .stat-value { animation: blink 0.5s infinite; }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        /* Game area */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            padding: 0 16px;
        }

        .game-board {
            position: relative;
            background: #0d1117;
            border: 2px solid #2a3245;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 1;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Progress */
        .progress-wrap {
            margin: 10px 16px 0;
            max-width: 500px;
            width: 100%;
        }

        .progress-bar {
            height: 22px;
            background: #2a3245;
            border-radius: 11px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            border-radius: 11px;
            transition: width 0.15s;
            position: relative;
        }

        .progress-fill.easy-bg { background: linear-gradient(90deg, #388E3C, #4CAF50, #81C784); }
        .progress-fill.normal-bg { background: linear-gradient(90deg, #E65100, #FF9800, #FFB74D); }
        .progress-fill.hard-bg { background: linear-gradient(90deg, #B71C1C, #f44336, #EF9A9A); }
        .progress-fill.hell-bg { background: linear-gradient(90deg, #4A148C, #9C27B0, #CE93D8); }

        .progress-markers {
            display: flex;
            justify-content: space-between;
            padding: 4px 4px 0;
            font-size: 10px;
            color: #666;
        }

        .progress-target {
            color: #fff;
            font-weight: 700;
        }

        .progress-text {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            max-width: 500px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 50px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            min-width: 70px;
        }

        .btn:active { transform: scale(0.94); }
        .btn:disabled { opacity: 0.4; pointer-events: none; }

        .btn-gold { background: var(--gold); color: #3E2723; box-shadow: 0 4px 14px rgba(212,160,23,0.35); }
        .btn-outline { background: transparent; color: #fff; border: 2px solid #444; }
        .btn-outline:hover { border-color: var(--gold); }

        /* Combo popup */
        .combo-pop {
            position: fixed;
            pointer-events: none;
            font-weight: 900;
            font-size: 32px;
            color: #FFD700;
            animation: comboUp 1s ease-out forwards;
            z-index: 100;
            text-shadow: 0 0 20px rgba(255,215,0,0.8);
        }

        @keyframes comboUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.5); opacity: 0; }
        }

        .peel-particle {
            position: fixed;
            pointer-events: none;
            font-size: 16px;
            animation: peelFly 0.7s ease-out forwards;
            z-index: 99;
        }

        @keyframes peelFly {
            0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--dx),var(--dy)) rotate(var(--r)); opacity: 0; }
        }

        /* Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            z-index: 20;
            gap: 12px;
            touch-action: manipulation;
        }

        .overlay.hidden { display: none; pointer-events: none; }

        .overlay .btn {
            min-width: 160px;
            min-height: 48px;
            font-size: 16px;
            touch-action: manipulation;
        }

        .overlay-emoji { font-size: 64px; }
        .overlay-title { font-size: 24px; font-weight: 900; }
        .overlay-score { font-size: 36px; font-weight: 900; color: #FFD700; }
        .overlay-sub { font-size: 13px; color: #aaa; }

        .stars { font-size: 36px; letter-spacing: 4px; }
        .star-empty { opacity: 0.25; }

        .diff-label {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 4px;
        }

        .diff-label.easy { background: rgba(76,175,80,0.25); color: #81C784; }
        .diff-label.normal { background: rgba(255,152,0,0.25); color: #FFB74D; }
        .diff-label.hard { background: rgba(244,67,54,0.25); color: #EF9A9A; }
        .diff-label.hell { background: rgba(156,39,176,0.25); color: #CE93D8; }

        @media (max-width: 400px) {
            .stat-box { padding: 6px 8px; }
            .stat-value { font-size: 16px; }
            .btn { padding: 8px 14px; font-size: 13px; min-width: 50px; }
            .overlay-emoji { font-size: 48px; }
            .overlay-title { font-size: 20px; }
            .overlay-score { font-size: 28px; }
        }
    </style>
</head>
<body>

    <!-- Difficulty Select -->
    <div class="diff-screen" id="diffScreen">
        <div class="logo">🥔</div>
        <h1>选择难度</h1>
        <div class="diff-grid">
            <div class="diff-card easy" data-diff="easy">
                <span class="diff-icon">🌱</span>
                <div class="diff-name">简单</div>
                <div class="diff-desc">削皮范围大<br>目标 80% · 计时</div>
            </div>
            <div class="diff-card normal" data-diff="normal">
                <span class="diff-icon">🥔</span>
                <div class="diff-name">普通</div>
                <div class="diff-desc">削皮范围适中<br>目标 88% · 计时</div>
            </div>
            <div class="diff-card hard" data-diff="hard">
                <span class="diff-icon">🔥</span>
                <div class="diff-name">困难</div>
                <div class="diff-desc">削皮范围小<br>目标 92% · 限时60秒</div>
            </div>
            <div class="diff-card hell" data-diff="hell">
                <span class="diff-icon">💀</span>
                <div class="diff-name">地狱</div>
                <div class="diff-desc">削皮范围极小<br>目标 95% · 限时45秒</div>
            </div>
        </div>
    </div>

    <!-- Game UI -->
    <div class="header">
        <h1>🥔 削土豆皮大挑战</h1>
        <p class="subtitle">
            手指滑动削皮
            <span class="diff-badge easy" id="diffBadge">简单</span>
        </p>
    </div>

    <div class="stats-bar">
        <div class="stat-box"><div class="stat-value" id="score">0</div><div class="stat-label">⭐ 得分</div></div>
        <div class="stat-box"><div class="stat-value" id="combo">x1</div><div class="stat-label">🔥 连击</div></div>
        <div class="stat-box"><div class="stat-value" id="levelDisplay">1/5</div><div class="stat-label">🥔 关卡</div></div>
        <div class="stat-box"><div class="stat-value" id="bestDisplay">0</div><div class="stat-label">🏆 最佳</div></div>
        <div class="stat-box timer-box" id="timerBox"><div class="stat-value" id="timer">00:00</div><div class="stat-label" id="timerLabel">⏱ 用时</div></div>
    </div>

    <div class="game-container">
        <div class="game-board" id="gameBoard">
            <canvas id="gameCanvas"></canvas>
            <div class="overlay hidden" id="levelOverlay">
                <div class="overlay-emoji" id="overlayEmoji">✨</div>
                <div class="overlay-title" id="overlayTitle">太棒了！</div>
                <div class="stars" id="starsDisplay">⭐⭐⭐</div>
                <div class="overlay-score" id="overlayScore">+200</div>
                <button class="btn btn-gold" id="overlayBtn">继续下一关 →</button>
            </div>
            <div class="overlay hidden" id="endOverlay">
                <div class="overlay-emoji" id="endEmoji">🏆</div>
                <div class="overlay-title">全部通关！</div>
                <div class="overlay-score" id="endScore">0</div>
                <div class="overlay-sub">总分</div>
                <span class="diff-label easy" id="endDiffLabel">简单</span>
                <button class="btn btn-gold" id="restartBtn" style="margin-top:8px;">🔄 再来一局</button>
                <button class="btn btn-outline" id="changeDiffBtn">🎚 换个难度</button>
            </div>
            <div class="overlay hidden" id="timeoutOverlay">
                <div class="overlay-emoji">⏰</div>
                <div class="overlay-title">时间到！</div>
                <div class="overlay-sub">削皮未达标，挑战失败</div>
                <button class="btn btn-gold" id="retryBtn">🔄 重试本关</button>
                <button class="btn btn-outline" id="giveUpBtn">🎚 换个难度</button>
            </div>
        </div>
    </div>

    <div class="progress-wrap">
        <div class="progress-bar">
            <div class="progress-fill easy-bg" id="progressFill" style="width:0%;"></div>
        </div>
        <div class="progress-markers">
            <span>0%</span><span>25%</span><span>50%</span><span class="progress-target" id="targetMarker">80%</span><span>100%</span>
        </div>
        <p class="progress-text" id="progressText">削皮进度 0% · 目标 80%</p>
    </div>

    <div class="btn-row">
        <button class="btn btn-outline" id="btnUndo">↩ 撤销</button>
        <button class="btn btn-outline" id="btnHint">💡 提示</button>
        <button class="btn btn-gold" id="btnReset">🔄 重新开始</button>
    </div>

<script>
// ─── Difficulty Config ───
const DIFFICULTIES = {
    easy:   { name:'简单', icon:'🌱', peelRadius:32, target:80, timeLimit:0,   bonusMul:1.0, desc:'削皮范围大 · 无计时' },
    normal: { name:'普通', icon:'🥔', peelRadius:24, target:88, timeLimit:0,   bonusMul:1.5, desc:'削皮范围适中 · 无计时' },
    hard:   { name:'困难', icon:'🔥', peelRadius:17, target:92, timeLimit:60,  bonusMul:2.5, desc:'削皮范围小 · 限时60秒' },
    hell:   { name:'地狱', icon:'💀', peelRadius:12, target:95, timeLimit:45,  bonusMul:4.0, desc:'削皮范围极小 · 限时45秒' },
};

// ─── State ───
let difficulty = 'normal';
let score = 0;
let bestScores = JSON.parse(localStorage.getItem('potatoPeelBests') || '{}');
let level = 1;
const maxLevel = 5;
let comboCount = 0;
let comboTimer = null;
let isPeeling = false;
let peelRadius = 24;
let potatoData = null;
let undoStack = [];
let gameActive = false;
let timerInterval = null;
let timeLeft = 0;
let totalElapsed = 0;

// ─── Level configs ───
const levels = [
    { name:'小土豆',   shape:'oval',      scale:0.72, roughness:0.06 },
    { name:'椭圆薯',   shape:'oval',      scale:0.78, roughness:0.10 },
    { name:'大块头',   shape:'irregular', scale:0.84, roughness:0.14 },
    { name:'怪形薯',   shape:'irregular', scale:0.90, roughness:0.18 },
    { name:'终极土豆', shape:'irregular', scale:0.95, roughness:0.24 },
];

// ─── DOM ───
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const board = document.getElementById('gameBoard');

// ─── Difficulty Selection ───
document.querySelectorAll('.diff-card').forEach(card => {
    card.addEventListener('click', function() {
        difficulty = this.dataset.diff;
        document.getElementById('diffScreen').classList.add('hidden');
        startGame();
    });
});

function startGame() {
    const cfg = DIFFICULTIES[difficulty];
    peelRadius = cfg.peelRadius;
    score = 0;
    level = 1;
    gameActive = true;
    updateDifficultyUI();
    document.getElementById('score').textContent = '0';
    document.getElementById('levelDisplay').textContent = '1/5';
    document.getElementById('bestDisplay').textContent = bestScores[difficulty] || '0';
    updateTimerVisibility();
    document.getElementById('endOverlay').classList.add('hidden');
    document.getElementById('timeoutOverlay').classList.add('hidden');
    document.getElementById('levelOverlay').classList.add('hidden');
    resetLevel();
}

function updateDifficultyUI() {
    const cfg = DIFFICULTIES[difficulty];
    const badge = document.getElementById('diffBadge');
    badge.textContent = cfg.name;
    badge.className = 'diff-badge ' + difficulty;
    document.getElementById('targetMarker').textContent = cfg.target + '%';
    document.getElementById('progressFill').className = 'progress-fill ' + difficulty + '-bg';
}

function updateTimerVisibility() {
    // Timer always visible — shows elapsed time for easy/normal, countdown for hard/hell
    const cfg = DIFFICULTIES[difficulty];
    document.getElementById('timerLabel').textContent = cfg.timeLimit > 0 ? '⏱ 剩余' : '⏱ 用时';
}

// ─── Timer ───
function startTimer() {
    const cfg = DIFFICULTIES[difficulty];
    clearInterval(timerInterval);
    document.getElementById('timerBox').classList.remove('warning');

    if (cfg.timeLimit > 0) {
        // Countdown mode (hard/hell)
        timeLeft = cfg.timeLimit;
        document.getElementById('timer').textContent = timeLeft + 's';
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').textContent = timeLeft + 's';
            if (timeLeft <= 10) document.getElementById('timerBox').classList.add('warning');
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                onTimeout();
            }
        }, 1000);
    } else {
        // Count-up / elapsed mode (easy/normal)
        totalElapsed = 0;
        document.getElementById('timer').textContent = '00:00';
        timerInterval = setInterval(() => {
            totalElapsed++;
            const m = Math.floor(totalElapsed / 60);
            const s = totalElapsed % 60;
            document.getElementById('timer').textContent =
                String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }, 1000);
    }
}

function onTimeout() {
    gameActive = false;
    const pct = getPeelPercent();
    const cfg = DIFFICULTIES[difficulty];
    if (pct >= cfg.target) {
        levelComplete();
    } else {
        document.getElementById('timeoutOverlay').classList.remove('hidden');
    }
}

// ─── Canvas ───
function resizeCanvas() {
    const rect = board.getBoundingClientRect();
    const size = rect.width;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
    return size;
}

function generatePotato(size) {
    const lvl = levels[level - 1];
    const cx = size / 2, cy = size / 2;
    const rx = size * lvl.scale * 0.42;
    const ry = size * lvl.scale * 0.48;

    const offCanvas = document.createElement('canvas');
    offCanvas.width = size; offCanvas.height = size;
    const offCtx = offCanvas.getContext('2d');

    offCtx.fillStyle = '#C87941';
    offCtx.beginPath();
    const points = 60;
    for (let i = 0; i < points; i++) {
        const angle = (i / points) * Math.PI * 2;
        const wobble = 1 + lvl.roughness * (Math.sin(angle*3)*Math.cos(angle*5) + Math.sin(angle*7)*0.5);
        const px = cx + Math.cos(angle) * rx * wobble;
        const py = cy + Math.sin(angle) * ry * wobble;
        if (i === 0) offCtx.moveTo(px, py);
        else offCtx.lineTo(px, py);
    }
    offCtx.closePath();
    offCtx.fill();

    // Eyes
    offCtx.fillStyle = '#8B5A2B';
    const eyes = [];
    const numEyes = 2 + Math.floor(Math.random() * 5);
    for (let i = 0; i < numEyes; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 0.12 + Math.random() * 0.55;
        const ex = cx + Math.cos(angle) * rx * dist;
        const ey = cy + Math.sin(angle) * ry * dist;
        const er = 3 + Math.random() * 7;
        offCtx.beginPath(); offCtx.arc(ex, ey, er, 0, Math.PI*2); offCtx.fill();
        eyes.push({ x:ex, y:ey, r:er });
    }

    offCtx.fillStyle = 'rgba(80,40,10,0.12)';
    offCtx.beginPath(); offCtx.arc(cx, cy, rx, 0, Math.PI*2); offCtx.fill();

    const skinData = offCtx.getImageData(0, 0, size, size);
    const skinSet = new Set();
    for (let i = 0; i < skinData.data.length; i += 4) {
        if (skinData.data[i + 3] > 0) skinSet.add((i/4) % size + Math.floor((i/4)/size) * size);
    }

    return { size, cx, cy, rx, ry, skinSet, skinData, eyes, peeled: new Set() };
}

function render() {
    const s = potatoData.size;
    ctx.clearRect(0, 0, s, s);

    // Peeled inside
    if (potatoData.peeled.size > 0) {
        ctx.fillStyle = '#FFE082';
        for (const idx of potatoData.peeled) {
            ctx.fillRect(idx % s, Math.floor(idx / s), 1, 1);
        }
    }

    // Skin
    for (const idx of potatoData.skinSet) {
        if (potatoData.peeled.has(idx)) continue;
        const x = idx % s, y = Math.floor(idx / s);
        const d = potatoData.skinData.data;
        const di = (y * s + x) * 4;
        const r = d[di], g = d[di+1], b = d[di+2];
        ctx.fillStyle = `rgb(${Math.min(255,r+Math.random()*8)},${Math.min(255,g+Math.random()*8)},${Math.min(255,b+Math.random()*8)})`;
        ctx.fillRect(x, y, 1, 1);
    }

    // Eyes
    for (const eye of potatoData.eyes) {
        ctx.fillStyle = '#7a4a1e';
        ctx.beginPath(); ctx.arc(eye.x, eye.y, eye.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#5a3010';
        ctx.beginPath(); ctx.arc(eye.x, eye.y, eye.r*0.45, 0, Math.PI*2); ctx.fill();
    }

    // Cursor ring
    if (isPeeling && gameActive) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5,5]);
        ctx.beginPath(); ctx.arc(mouseX, mouseY, peelRadius, 0, Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);
    }
}

// ─── Peel logic ───
function peel(x, y) {
    if (!gameActive || !potatoData) return;
    const s = potatoData.size;
    const r = peelRadius;
    let newly = 0;
    const newSet = new Set();

    for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
            if (dx*dx + dy*dy > r*r) continue;
            const px = Math.floor(x+dx), py = Math.floor(y+dy);
            if (px<0||px>=s||py<0||py>=s) continue;
            const idx = py*s + px;
            if (potatoData.skinSet.has(idx) && !potatoData.peeled.has(idx)) {
                potatoData.peeled.add(idx);
                newSet.add(idx);
                newly++;
            }
        }
    }

    if (newly > 0) {
        comboCount++;
        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => { comboCount = 0; updateComboUI(); }, 700);

        const cfg = DIFFICULTIES[difficulty];
        const multiplier = 1 + Math.floor(comboCount / 25);
        score += newly * multiplier * cfg.bonusMul;
        updateScore();
        updateComboUI();
        updateProgress();

        if (newly > 5) spawnParticles(x, y, newly);
        if (comboCount > 0 && comboCount % 25 === 0) showCombo(x, y, Math.floor(comboCount/25)+1);

        const pct = getPeelPercent();
        if (pct >= cfg.target && gameActive) levelComplete();
    }
}

function getPeelPercent() {
    if (!potatoData) return 0;
    return Math.round((potatoData.peeled.size / potatoData.skinSet.size) * 100);
}

function updateProgress() {
    const pct = getPeelPercent();
    const cfg = DIFFICULTIES[difficulty];
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `削皮进度 ${pct}% · 目标 ${cfg.target}%`;
}

function updateScore() {
    document.getElementById('score').textContent = Math.floor(score);
    const prev = bestScores[difficulty] || 0;
    if (score > prev) {
        bestScores[difficulty] = Math.floor(score);
        localStorage.setItem('potatoPeelBests', JSON.stringify(bestScores));
        document.getElementById('bestDisplay').textContent = Math.floor(score);
    }
}

function updateComboUI() {
    document.getElementById('combo').textContent = 'x' + Math.max(1, Math.floor(comboCount/10)+1);
}

// ─── Effects ───
function showCombo(x, y, mult) {
    const pop = document.createElement('div');
    pop.className = 'combo-pop';
    pop.textContent = '🔥 x' + mult;
    const rect = board.getBoundingClientRect();
    pop.style.left = rect.left + x + 'px';
    pop.style.top = rect.top + y + 'px';
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 1000);
}

function spawnParticles(x, y, count) {
    const rect = board.getBoundingClientRect();
    const p = ['🍂','✨','💫','⭐'];
    for (let i = 0; i < Math.min(count/4, 8); i++) {
        const el = document.createElement('div');
        el.className = 'peel-particle';
        el.textContent = p[Math.floor(Math.random()*p.length)];
        el.style.left = rect.left + x + 'px';
        el.style.top = rect.top + y + 'px';
        el.style.setProperty('--dx', (Math.random()-0.5)*120+'px');
        el.style.setProperty('--dy', -(30+Math.random()*80)+'px');
        el.style.setProperty('--r', (Math.random()-0.5)*360+'deg');
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 700);
    }
}

// ─── Level flow ───
function levelComplete() {
    gameActive = false;
    clearInterval(timerInterval);
    const cfg = DIFFICULTIES[difficulty];
    const pct = getPeelPercent();
    timeLeft = Math.max(0, timeLeft);

    // Star rating
    let stars = 0;
    if (pct >= cfg.target) stars++;
    if (pct >= cfg.target + 5) stars++;
    if (pct >= cfg.target + 9 && (cfg.timeLimit === 0 || timeLeft > cfg.timeLimit * 0.2)) stars++;
    const starStr = '⭐'.repeat(stars) + '<span class="star-empty">⭐</span>'.repeat(3-stars);

    const timeBonus = cfg.timeLimit > 0 ? timeLeft * 5 : Math.max(0, (180 - totalElapsed)) * 2;
    const bonus = Math.floor(cfg.bonusMul * 100 * stars + timeBonus);
    score += bonus;
    updateScore();

    const emoji = stars >= 3 ? '🏆' : stars >= 2 ? '✨' : '👍';
    document.getElementById('overlayEmoji').textContent = emoji;
    document.getElementById('overlayTitle').textContent = level >= maxLevel ? '全部通关！' : '关卡通过！';
    document.getElementById('starsDisplay').innerHTML = starStr;
    document.getElementById('overlayScore').textContent = '+' + bonus + ' 分';
    document.getElementById('levelOverlay').classList.remove('hidden');

    const btn = document.getElementById('overlayBtn');
    if (level >= maxLevel) {
        btn.textContent = '🎉 查看成绩';
        btn.onclick = showEndScreen;
    } else {
        btn.textContent = '继续下一关 →';
        btn.onclick = nextLevel;
    }
}

function showEndScreen() {
    document.getElementById('levelOverlay').classList.add('hidden');
    document.getElementById('endOverlay').classList.remove('hidden');
    document.getElementById('endScore').textContent = Math.floor(score);
    const emoji = score > 5000 ? '🏆' : score > 2000 ? '🎉' : '🥔';
    document.getElementById('endEmoji').textContent = emoji;
    const endDiff = document.getElementById('endDiffLabel');
    endDiff.textContent = DIFFICULTIES[difficulty].name;
    endDiff.className = 'diff-label ' + difficulty;
}

function nextLevel() {
    level++;
    document.getElementById('levelDisplay').textContent = level + '/' + maxLevel;
    document.getElementById('levelOverlay').classList.add('hidden');
    resetLevel();
}

function resetLevel() {
    comboCount = 0;
    updateComboUI();
    document.getElementById('progressFill').style.width = '0%';
    const cfg = DIFFICULTIES[difficulty];
    document.getElementById('progressText').textContent = '削皮进度 0% · 目标 ' + cfg.target + '%';
    document.getElementById('levelOverlay').classList.add('hidden');
    document.getElementById('endOverlay').classList.add('hidden');
    document.getElementById('timeoutOverlay').classList.add('hidden');
    gameActive = true;
    undoStack = [];
    clearInterval(timerInterval);

    const size = resizeCanvas();
    potatoData = generatePotato(size);
    render();
    startTimer();
}

function restartFromStart() {
    score = 0;
    level = 1;
    document.getElementById('score').textContent = '0';
    document.getElementById('levelDisplay').textContent = '1/5';
    document.getElementById('endOverlay').classList.add('hidden');
    document.getElementById('timeoutOverlay').classList.add('hidden');
    resetLevel();
}

function showDiffSelect() {
    clearInterval(timerInterval);
    document.getElementById('endOverlay').classList.add('hidden');
    document.getElementById('timeoutOverlay').classList.add('hidden');
    document.getElementById('levelOverlay').classList.add('hidden');
    document.getElementById('diffScreen').classList.remove('hidden');
}

// ─── Buttons ───
document.getElementById('btnUndo').addEventListener('click', () => {
    if (!gameActive || !potatoData || undoStack.length === 0) return;
    const last = undoStack.pop();
    for (const idx of last) potatoData.peeled.delete(idx);
    comboCount = Math.max(0, comboCount - last.length);
    updateComboUI();
    updateProgress();
    render();
});

document.getElementById('btnHint').addEventListener('click', () => {
    if (!gameActive || !potatoData) return;
    const remaining = [...potatoData.skinSet].filter(i => !potatoData.peeled.has(i));
    if (!remaining.length) return;
    const s = potatoData.size;
    for (let i = 0; i < 12; i++) {
        const idx = remaining[Math.floor(Math.random()*remaining.length)];
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.beginPath(); ctx.arc(idx%s, Math.floor(idx/s), 4, 0, Math.PI*2); ctx.fill();
    }
});

document.getElementById('btnReset').addEventListener('click', restartFromStart);
document.getElementById('restartBtn').addEventListener('click', restartFromStart);
document.getElementById('changeDiffBtn').addEventListener('click', showDiffSelect);
document.getElementById('retryBtn').addEventListener('click', resetLevel);
document.getElementById('giveUpBtn').addEventListener('click', showDiffSelect);

// ─── Input ───
let mouseX=0, mouseY=0;

function getPos(e) {
    const rect = board.getBoundingClientRect();
    const s = potatoData ? potatoData.size / rect.width : 1;
    const c = e.touches ? { x:e.touches[0].clientX, y:e.touches[0].clientY } : { x:e.clientX, y:e.clientY };
    return { x:(c.x-rect.left)*s, y:(c.y-rect.top)*s };
}

function onStart(e) {
    if (!gameActive) return;
    e.preventDefault();
    const p = getPos(e);
    mouseX=p.x; mouseY=p.y;
    isPeeling = true;
    undoStack.push(new Set());
    peel(p.x, p.y);
}

function onMove(e) {
    e.preventDefault();
    if (!isPeeling || !gameActive) return;
    const p = getPos(e);
    mouseX=p.x; mouseY=p.y;
    // Track undo
    if (undoStack.length && undoStack[undoStack.length-1]) {
        for (let dy=-peelRadius; dy<=peelRadius; dy++)
            for (let dx=-peelRadius; dx<=peelRadius; dx++)
                if (dx*dx+dy*dy <= peelRadius*peelRadius) {
                    const px=Math.floor(p.x+dx), py=Math.floor(p.y+dy);
                    const idx = py*potatoData.size + px;
                    if (potatoData.skinSet.has(idx) && !potatoData.peeled.has(idx))
                        undoStack[undoStack.length-1].add(idx);
                }
    }
    peel(p.x, p.y);
    render();
}

function onEnd() {
    if (!isPeeling) return;
    isPeeling = false;
    if (undoStack.length && undoStack[undoStack.length-1].size === 0) undoStack.pop();
    if (undoStack.length > 30) undoStack.shift();
    render();
}

board.addEventListener('mousedown', onStart);
board.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onEnd);
board.addEventListener('touchstart', onStart, { passive:false });
board.addEventListener('touchmove', onMove, { passive:false });
window.addEventListener('touchend', onEnd);
board.addEventListener('touchmove', e => { if (gameActive) e.preventDefault(); }, { passive:false });

// ─── Resize ───
window.addEventListener('resize', () => {
    if (potatoData && document.getElementById('diffScreen').classList.contains('hidden')) {
        potatoData.size = resizeCanvas();
        render();
    }
});

// ─── Init ───
document.getElementById('bestDisplay').textContent = bestScores[difficulty] || '0';
console.log('🥔 削土豆皮大挑战 v2 就绪！');
</script>
